name: Subs
options:
  bundleIdPrefix: app.subs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
packages:
  # The house settings shell, glyphs and changelog view
  # (michellzappa/housekit). Pinned to a release tag so CI, the mini and the
  # laptop build the same code; move the pin on purpose.
  HouseKit:
    url: https://github.com/michellzappa/housekit
    exactVersion: 0.1.0
  # The subtitle engine, a Swift package at this repo's root. Cargo uses it too.
  EasySubsKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Keychain keys its access grant to the code signature, so an ad-hoc build
    # asks for the OpenSubtitles password again after every rebuild. Sign with
    # the stable Apple Development identity.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: 992N457T8D
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  Subs:
    type: application
    platform: macOS
    sources:
      - path: Subs
        excludes:
          - "Resources/Info.plist"
          - "Resources/Subs.entitlements"
      - path: CHANGELOG.md
        buildPhase: resources
    dependencies:
      - package: HouseKit
        product: HouseKit
      - package: EasySubsKit
        product: EasySubsKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.subs.Subs
        PRODUCT_NAME: Subs
        CODE_SIGN_ENTITLEMENTS: Subs/Resources/Subs.entitlements
        INFOPLIST_FILE: Subs/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
schemes:
  Subs:
    build:
      targets:
        Subs: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
